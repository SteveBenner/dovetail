          scale: ["95", "100", "105"]
          rotate: ["0", "45", "90", "180"]
        static: [flex, inline-flex, grid, inline-grid, block, inline-block, inline, hidden, contents, flow-root, table, table-row, table-cell, table-header-group, table-row-group, flex-row, flex-row-reverse, flex-col, flex-col-reverse, flex-wrap, flex-nowrap, flex-wrap-reverse, flex-1, flex-auto, flex-initial, flex-none, grow, grow-0, shrink, shrink-0, items-start, items-end, items-center, items-baseline, items-stretch, justify-start, justify-end, justify-center, justify-between, justify-around, justify-evenly, justify-stretch, justify-items-start, justify-items-end, justify-items-center, justify-items-stretch, justify-self-auto, justify-self-start, justify-self-end, justify-self-center, justify-self-stretch, content-start, content-end, content-center, content-between, content-around, content-evenly, content-stretch, self-auto, self-start, self-end, self-center, self-stretch, self-baseline, place-items-start, place-items-end, place-items-center, place-items-stretch, place-content-start, place-content-end, place-content-center, place-content-between, place-content-stretch, place-self-auto, place-self-start, place-self-end, place-self-center, place-self-stretch, truncate, overflow-auto, overflow-hidden, overflow-visible, overflow-scroll, overflow-clip, overflow-x-auto, overflow-x-hidden, overflow-x-scroll, overflow-x-clip, overflow-y-auto, overflow-y-hidden, overflow-y-scroll, overflow-y-clip, relative, absolute, static, sticky, isolate, isolation-auto, visible, invisible, collapse, object-contain, object-cover, object-fill, object-none, object-scale-down, object-center, object-top, aspect-auto, aspect-square, aspect-video, sr-only, not-sr-only, cursor-auto, cursor-default, cursor-pointer, cursor-wait, cursor-text, cursor-move, cursor-not-allowed, cursor-grab, cursor-grabbing, cursor-help, select-none, select-text, select-all, select-auto, pointer-events-none, pointer-events-auto, resize, resize-none, resize-x, resize-y, appearance-none, list-none, list-disc, list-dec