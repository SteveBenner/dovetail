schema: rstack.blueprint/v1
task: dovetail-0.1.0
version: 0.1.0
intent: >
  Build Dovetail 0.1.0 from specs/dovetail.spec.yml: the contract DSL and its loader, the compiler (JSON Schema,
  TypeScript, the data client, shape.json, the brief, registry entries), the pure-Ruby shape checker, shape signing,
  the fuser, the Ferrum composition verifier, the development server, the Svelte 5 runtime (@dovetail/runtime), the
  command line and the starter templates. The spec is the product definition; its implementation_decisions section
  (at the end of the file) settles every point the spec left open, and this blueprint settles the rest. Four workers
  build four slices in parallel in one working tree with disjoint file ownership. Where this file and the spec
  differ, this file wins; where both are silent, stop and report instead of choosing.
harness: claude-code
worker: { model: sonnet, effort: medium, definition: coding-worker }
repository: bitbucket.org/paterasai/dovetail (a local checkout)
spec: specs/dovetail.spec.yml

constraints:
  - >-
    AGENTS.md Part S. Write no tests, no spec files, no test directories and no test helpers. Verify by running the
    real command line and code against throwaway fixtures kept OUTSIDE the repository, in the scratchpad directory
    <scratchpad>/dovetail-<slice>/, where <scratchpad> is the session scratch directory the primary names
    and report exactly what you ran and what it printed.
  - >-
    AGENTS.md Part Q. Write no comments, doc comments or docstrings in any file (Ruby, TypeScript, Svelte, CSS, JSON,
    YAML, Markdown code blocks inside templates). Only lines a tool reads survive, such as the exe/dovetail shebang.
  - AGENTS.md Part F. No authorship or agent attribution anywhere.
  - AGENTS.md Part E. Delete nothing outside your own scratch directory; never run rm -r, git clean or find -delete.
  - >-
    AGENTS.md Part J. Query codebase memory (project home-sven-bitbucket-paterasai-dovetail) before grepping when you
    need to find code another slice wrote.
  - Do not run git add, git commit, git stash, git checkout or any other git write. The primary stages and commits.
  - >-
    Touch only the paths your slice owns (owns_paths). You may read anything. If you need a change in a path another
    slice owns, write it in your report instead of making it.
  - >-
    No em-dash or en-dash characters in any user-visible string (messages, briefs, templates, runtime copy, CLI output).
    Use a hyphen, a comma or two sentences.
  - >-
    Ruby layers (everything under lib/ except lib/dovetail/verify/) run on Ruby 2.6.10 through 4.0.x with the standard
    library only. Forbidden because they do not exist on the 2.6 floor - Hash#except, Enumerable#filter_map,
    Enumerable#tally, Array#intersect?, numbered block parameters (_1), pattern matching (case/in), rightward
    assignment, endless methods, argument forwarding (...), anonymous block or rest forwarding (&, *, **), hash value
    shorthand ({x:}), Data.define, Comparable#clamp with a Range, and positional permitted classes for YAML. Use
    YAML.safe_load(text, permitted_classes: [], aliases: false) with keyword arguments. Require "set" explicitly.
    WEBrick is not in the standard library on 3.x; use TCPServer.
  - >-
    Check every Ruby file you write with the 2.6 floor, not only the host Ruby, using
    docker run --rm -v "$PWD":/d -w /d ruby:2.6.10-slim (from the repository root) ruby -c <file> for syntax and
    by running the slice's commands inside that container (the image is already pulled).

environment:
  ruby_host: /usr/bin/ruby is Ruby 3.3. Ruby 4.0.6 is at ~/.rubies/ruby-4.0.6/bin/ruby.
  ruby_floor: docker image ruby:2.6.10-slim (standard library only; no git, no build tools).
  node: Node 26.10, npm 11.19, pnpm 11.25 on the PATH; the npm registry is reachable.
  browsers: System Google Chrome 154 at /usr/bin/google-chrome. Use it for headless work (user-installed Chromium is
    blocked by AppArmor on this host). Run headless.
  ferrum: Not installed. Slice D installs it through the Gemfile's verify group with bundle config set --local path
    vendor/bundle, on /usr/bin/ruby.
  svelte: 5.57.x is current on npm.

foundation:
  owner: slice_a
  rule: >
    These files are shared by every Ruby slice. Their content is fixed and given verbatim here. Slice A writes them
    first, before anything else. Any other slice that needs one before it exists may write it with exactly this content,
    byte for byte, and must not change it; whoever writes it, the bytes are the same. Only slice A may change a
    foundation file, and only to register its own command in COMMANDS if the list here is wrong (it is not).
  files:
    - path: lib/dovetail.rb
      content: |
        require_relative "dovetail/version"
        require_relative "dovetail/errors"
        require_relative "dovetail/canonical_json"

        module Dovetail
          autoload :Contract, "dovetail/contract"
          autoload :Compiler, "dovetail/compiler"
          autoload :Shape, "dovetail/shape"
          autoload :Tokens, "dovetail/tokens"
          autoload :Signing, "dovetail/signing"
          autoload :Config, "dovetail/config"
          autoload :Layout, "dovetail/layout"
          autoload :Fuse, "dovetail/fuse"
          autoload :Verify, "dovetail/verify"
          autoload :Dev, "dovetail/dev"
          autoload :Messages, "dovetail/messages"
          autoload :CLI, "dovetail/cli"

          def self.root
            File.expand_path("..", __dir__)
          end
        end
    - path: lib/dovetail/version.rb
      content: |
        module Dovetail
          VERSION = "0.1.0"
        end
    - path: lib/dovetail/errors.rb
      content: |
        module Dovetail
          class Error < StandardError
            attr_reader :code, :details

            def initialize(code, message, details = {})
              @code = code
              @details = details
              super(message)
            end
          end
        end
    - path: lib/dovetail/canonical_json.rb
      content: |
        require "json"

        module Dovetail
          module CanonicalJSON
            module_function

            def sort(value)
              case value
              when Hash
                pairs = value.map { |key, item| [key.to_s, item] }
                pairs.sort_by { |pair| pair[0] }.each_with_object({}) { |pair, out| out[pair[0]] = sort(pair[1]) }
              when Array
                value.map { |item| sort(item) }
              when Symbol
                value.to_s
              else
                value
              end
            end

            def dump(value)
              JSON.generate(sort(value))
            end

            def pretty(value)
              "#{JSON.pretty_generate(sort(value))}\n"
            end
          end
        end
    - path: lib/dovetail/cli.rb
      content: |
        module Dovetail
          module CLI
            COMMANDS = {
              "compile" => ["dovetail/cli/compile", "Compile"],
              "check" => ["dovetail/cli/check", "Check"],
              "fuse" => ["dovetail/cli/fuse", "Fuse"],
              "verify" => ["dovetail/cli/verify", "Verify"],
              "contract" => ["dovetail/cli/contract", "Contract"],
              "brief" => ["dovetail/cli/brief", "Brief"],
              "sign" => ["dovetail/cli/sign", "Sign"],
              "new" => ["dovetail/cli/new", "New"],
              "rules" => ["dovetail/cli/rules", "Rules"],
              "dev" => ["dovetail/cli/dev", "Dev"],
              "messages" => ["dovetail/cli/messages", "Messages"]
            }.freeze

            USAGE = <<~TEXT.freeze
              Usage: dovetail <command> [options]

                compile <contract.rb>... --out <dir>
                check <panel_dir> --shape <file> [--require-signed --public-key <pem>] [--format text|json]
                fuse --app <shell> --panels <dir>... [--verify] [--out <dist>]
                verify <dist>
                contract lint|diff|show <file>...
                brief <shape.json>
                sign <shape.json> --private-key <pem>
                new shell|panel <name>
                rules [id]
                dev --app <shell> --panels <dir>... [--backend <url>] [--static] [--port <n>]
                messages check [--app <shell>] [--panels <dir>...]

              Global flags: --quiet --no-color --version
            TEXT

            class << self
              attr_accessor :quiet, :color

              def run(argv, stdout: $stdout, stderr: $stderr)
                args = argv.dup
                self.quiet = !args.delete("--quiet").nil?
                no_color = !args.delete("--no-color").nil?
                self.color = !no_color && ENV["NO_COLOR"].to_s.empty? && stdout.respond_to?(:tty?) && stdout.tty?
                if args.delete("--version")
                  stdout.puts("dovetail #{Dovetail::VERSION}")
                  return 0
                end
                name = args.shift
                if name.nil?
                  stderr.puts(USAGE)
                  return 2
                end
                if %w[help --help -h].include?(name)
                  stdout.puts(USAGE)
                  return 0
                end
                entry = COMMANDS[name]
                unless entry
                  stderr.puts("dovetail: unknown command #{name}")
                  stderr.puts(USAGE)
                  return 2
                end
                require entry[0]
                const_get(entry[1]).run(args, stdout: stdout, stderr: stderr)
              rescue Dovetail::Error => e
                stderr.puts("#{e.code} #{e.message}")
                2
              end
            end
          end
        end
    - path: exe/dovetail
      mode: "0755"
      content: |
        #!/usr/bin/env ruby
        $LOAD_PATH.unshift(File.expand_path("../lib", __dir__))
        require "dovetail"
        require "dovetail/cli"
        exit(Dovetail::CLI.run(ARGV))
    - path: dovetail.gemspec
      content: |
        require_relative "lib/dovetail/version"

        Gem::Specification.new do |spec|
          spec.name = "dovetail"
          spec.version = Dovetail::VERSION
          spec.summary = "A typed UI framework for fusing independently built frontend modules into one application."
          spec.authors = ["PaterasAI"]
          spec.license = "AGPL-3.0-only"
          spec.required_ruby_version = ">= 2.6.10"
          spec.files = Dir.glob(%w[lib/**/* exe/* templates/**/* runtime/src/**/* runtime/tools/**/* runtime/package.json runtime/package-lock.json specs/**/* README.md CHANGELOG.md VERSION], File::FNM_DOTMATCH).reject { |path| File.directory?(path) }
          spec.bindir = "exe"
          spec.executables = ["dovetail"]
          spec.require_paths = ["lib"]
        end
    - path: Gemfile
      content: |
        source "https://rubygems.org"

        gemspec

        group :verify, optional: true do
          gem "ferrum"
        end
    - path: .gitignore
      content: |
        /.bundle/
        /vendor/bundle/
        /runtime/node_modules/
        /runtime/dist/
        /runtime/.svelte-kit/
        .dovetail/
        /pkg/
        *.gem
        TMP_AGENT_FILE_LOCKS.yml

shared_contracts:
  cli_command_contract: >
    Every subcommand is a module Dovetail::CLI::<Name> in lib/dovetail/cli/<name>.rb exposing
    self.run(args, stdout:, stderr:) -> Integer (the exit code). The dispatcher has already removed --quiet, --no-color
    and --version from args; read Dovetail::CLI.quiet and Dovetail::CLI.color. Parse options with the standard library
    OptionParser. A Dovetail::Error that escapes run is printed as "<code> <message>" on stderr with exit 2 by the
    dispatcher; catch it yourself when the command's own exit code table says otherwise.

  model_json:
    producer: slice_a
    consumers: [slice_d]
    form: >
      The contract model as plain JSON (what dovetail contract show prints and what compile writes to
      <out>/model/<module>.model.json), keys sorted, written with Dovetail::CanonicalJSON.pretty. Shape:
    example: |
      {
        "schema": "dovetail.model/v1",
        "module": "finance",
        "version": 2,
        "description": null,
        "depends_on": [{"module": "context", "requirement": ">= 1"}],
        "types": {
          "margin": {"fields": [
            {"name": "gross_margin_pct", "type": {"kind": "scalar", "name": "Decimal"}, "required": true, "nullable": true,
             "description": null, "default": null, "has_default": false, "enum": null, "min": null, "max": null,
             "pattern": null, "format": null, "sensitive": false, "deprecated": null},
            {"name": "status", "type": {"kind": "scalar", "name": "String"}, "required": true, "nullable": false,
             "enum": ["ok", "undefined"], "...": "remaining options as above"}]}
        },
        "operations": {
          "margin": {"input": {"kind": "inline", "fields": ["...field objects..."]}, "output": {"kind": "named", "name": "margin"},
                     "errors": ["insufficient_input"], "timeout_ms": 10000, "idempotent": false, "description": null},
          "findings": {"input": {"kind": "inline", "fields": []}, "output": {"kind": "list", "of": {"kind": "named", "name": "finding"}},
                       "errors": ["unavailable"], "timeout_ms": 10000, "idempotent": false, "description": null}
        },
        "emits": {"finding_selected": {"payload": {"kind": "inline", "fields": ["..."]}, "description": null}},
        "consumes": [{"module": "context", "event": "settings_changed"}],
        "panel": {
          "slots": [{"name": "main", "size": "main", "min_width": 480, "max_width": null, "description": null}],
          "views": [{"name": "dashboard", "data": "findings", "states": ["loading", "empty", "error", "unavailable", "ready"], "description": null}],
          "capabilities": ["navigation", "overlay", "storage"],
          "routes": ["/finance", "/finance/findings/:id"],
          "props": [{"name": "tenant", "type": {"kind": "scalar", "name": "Id"}, "required": true}],
          "tokens": ["default"],
          "storage_keys": [{"name": "period", "type": {"kind": "scalar", "name": "String"}, "ttl_days": 30}],
          "shortcuts": [{"keys": "mod+k", "action": "open_search", "scope": "panel"}],
          "overlays": [{"name": "finding_detail", "kind": "drawer", "dismissible": true, "blocking": true, "description": null}]
        }
      }
    type_ref_kinds: >
      {"kind":"scalar","name":<one of String Integer Decimal Boolean Date DateTime Id Money Percent Url Email>},
      {"kind":"named","name":<type in this contract>}, {"kind":"ref","module":<m>,"name":<type>},
      {"kind":"list","of":<ref>}, {"kind":"map","of":<ref>} (keys are strings), {"kind":"one_of","names":[<type>...]},
      {"kind":"inline","fields":[<field>...]} (only for operation input/output, event payload and a type option given
      as a Hash). A panel with no panel block has "panel": null.

  shape_json:
    producer: slice_a
    consumers: [slice_b, slice_d]
    form: >
      Exactly the spec's shape_json (schema dovetail.shape/v1) with these precise encodings. Keys sorted, written with
      Dovetail::CanonicalJSON.pretty. Ids are qualified: operations "<module>.<op>", events "<module>.<event>",
      views' data_operation "<module>.<op>". Arrays: routes in declaration order; operations sorted; emits and consumes
      sorted; capabilities are the declared ones, sorted; slots, views, overlays, storage_keys and shortcuts in
      declaration order. tokens is ["default"] for tokens
      :default, else the listed family names. rules_profile is "strict" unless the panel says rules_profile :relaxed
      (not a DSL statement in 0.1.0, so always "strict"). A contract with no panel block produces no shape file.
    example: |
      {"capabilities":["navigation","overlay","storage"],"contract_version":2,
       "events":{"consumes":["context.settings_changed"],"emits":["finance.finding_selected"]},
       "module":"finance","operations":["finance.findings","finance.margin"],
       "overlays":[{"blocking":true,"dismissible":true,"kind":"drawer","name":"finding_detail"}],
       "routes":["/finance","/finance/findings/:id"],"rules_profile":"strict","schema":"dovetail.shape/v1",
       "shortcuts":[],"slots":[{"max_width":null,"min_width":480,"name":"main","size":"main"},
       {"max_width":null,"min_width":null,"name":"summary","size":"tile"}],
       "storage_keys":[{"name":"period","ttl_days":30}],"tokens":["default"],
       "views":[{"data_operation":"finance.findings","name":"dashboard","states":["loading","empty","error","unavailable","ready"]},
                {"data_operation":"finance.margin","name":"margin_tile","states":["loading","empty","error","unavailable","ready"]}]}
    note: >
      The object carries "schema":"dovetail.shape/v1" as a key (the spec lists it as the file's schema id). The
      signature covers Dovetail::CanonicalJSON.dump of the parsed object, so pretty printing never affects it.

  registry_entry_json:
    producer: slice_a
    consumers: [slice_d]
    path: <out>/registry/<module>.json
    example: |
      {
        "schema": "dovetail.registry-entry/v1",
        "module": "finance",
        "title": "Finance",
        "contract_version": 2,
        "schema_file": "schema/finance.schema.json",
        "slots": [{"name": "main", "size": "main", "min_width": 480, "max_width": null}],
        "routes": ["/finance", "/finance/findings/:id"],
        "overlays": [{"name": "finding_detail", "kind": "drawer", "dismissible": true, "blocking": true}],
        "shortcuts": [],
        "storage_keys": [{"name": "period", "ttl_days": 30, "schema": {"$ref": "finance.schema.json#/$defs/storage.period"}}],
        "emits": [{"id": "finance.finding_selected", "payload_schema": {"$ref": "finance.schema.json#/$defs/event.finding_selected.payload"}}],
        "consumes": ["context.settings_changed"],
        "operations": [{"id": "finance.findings", "name": "findings", "timeout_ms": 10000, "idempotent": false,
                        "errors": ["unavailable"],
                        "input_schema": {"$ref": "finance.schema.json#/$defs/operation.findings.input"},
                        "output_schema": {"$ref": "finance.schema.json#/$defs/operation.findings.output"}}],
        "views": [{"name": "dashboard", "data_operation": "finance.findings", "states": ["loading", "empty", "error", "unavailable", "ready"]}],
        "props": [{"name": "tenant", "required": true, "schema": {"$ref": "finance.schema.json#/$defs/prop.tenant"}}],
        "depends_on": [{"module": "context", "requirement": ">= 1"}]
      }
    title_rule: The module id with _ replaced by a space and the first letter of each word capitalised (people_operations -> People Operations).

  json_schema:
    producer: slice_a
    consumers: [slice_c, slice_d]
    document: >
      <out>/schema/<module>.schema.json is one JSON Schema 2020-12 document: {"$schema":
      "https://json-schema.org/draft/2020-12/schema", "$id": "<module>.schema.json", "title": <title>, "$defs": {...}}.
      $defs keys - each contract type by its name; "operation.<op>.input" and "operation.<op>.output";
      "event.<event>.payload"; "storage.<key>"; "prop.<name>"; and the scalar helpers it uses, named "_Decimal", "_Money",
      "_Id", "_CurrencyCode", "_Percent". A cross-module ref(:other, :type) is {"$ref": "<other>.schema.json#/$defs/<type>"}.
    mapping:
      String: '{"type":"string"}'
      Integer: '{"type":"integer"}'
      Decimal: '{"$ref":"#/$defs/_Decimal"} where _Decimal is {"type":"string","pattern":"^-?[0-9]+(\\.[0-9]+)?$"}'
      Percent: '{"$ref":"#/$defs/_Percent"}, same as _Decimal'
      Boolean: '{"type":"boolean"}'
      Date: '{"type":"string","format":"date"}'
      DateTime: '{"type":"string","format":"date-time"}'
      Id: '{"$ref":"#/$defs/_Id"} where _Id is {"type":"string","minLength":1}'
      Money: '{"$ref":"#/$defs/_Money"} where _Money is {"type":"object","required":["amount","currency"],"additionalProperties":false,"properties":{"amount":{"$ref":"#/$defs/_Decimal"},"currency":{"$ref":"#/$defs/_CurrencyCode"}}} and _CurrencyCode is {"type":"string","pattern":"^[A-Z]{3}$"}'
      Url: '{"type":"string","format":"uri"}'
      Email: '{"type":"string","format":"email"}'
      list: '{"type":"array","items":<of>}'
      map: '{"type":"object","additionalProperties":<of>}'
      one_of: >-
        {"oneOf":[...]} with one entry per named type, each the named type's object schema inlined with an added
        required property "kind" whose schema is {"const":"<type name>"}
      named: '{"$ref":"#/$defs/<name>"}'
      object_type: '{"type":"object","additionalProperties":false,"properties":{...},"required":[...]}; required lists fields with required true and no default'
      nullable: '{"anyOf":[<schema>,{"type":"null"}]}'
      options: >-
        description -> "description"; default -> "default"; enum -> "enum"; min/max -> "minimum"/"maximum" for Integer,
        "minLength"/"maxLength" for String, Url and Email, "minItems"/"maxItems" for list, and "x-dovetail-min"/"x-dovetail-max"
        for Decimal, Percent and Money; pattern -> "pattern"; format iso_date -> "format":"date", iso_datetime ->
        "format":"date-time", currency_code -> pattern ^[A-Z]{3}$, locale -> pattern ^[a-z]{2,3}(-[A-Z]{2})?$,
        country_code -> pattern ^[A-Z]{2}$, sha256 -> pattern ^[0-9a-f]{64}$; sensitive -> "x-dovetail-sensitive":true;
        deprecated -> "deprecated":true and "x-dovetail-replacement":<the string>.

  typescript_and_client:
    producer: slice_a
    consumers: [slice_c, slice_d]
    types_file: >
      <out>/types/<module>.d.ts. First line: import type { Decimal, IsoDate, IsoDateTime, Id, CurrencyCode, Money } from
      '@dovetail/runtime'; (import only those used). Then, for a consumed event whose producer is in the same compile,
      import type { <PayloadType> } from './<producer>'. Names are PascalCase: type margin -> Margin; inline operation
      input -> <Op>Input, inline output -> <Op>Output; inline event payload -> <Event>Payload; storage key value type
      is used inline. Every property is readonly. Optional fields (required false or with a default) use ?. The spec's
      mapping table applies; Percent is Decimal; Url and Email are string. one_of(:a, :b) -> (A & { readonly kind: 'a' })
      | (B & { readonly kind: 'b' }). Then these exports, with <M> the PascalCase module id -
      export type <M>EmittedEvent = 'finance.finding_selected' | ...; (never when none);
      export interface <M>EventPayloads { readonly 'finance.finding_selected': FindingSelectedPayload };
      export type <M>ConsumedEvent = 'context.settings_changed' | ...;
      export type <M>Event = { readonly event: 'finance.finding_selected'; readonly payload: FindingSelectedPayload } | ...;
      export interface <M>Props { ...declared props } (export type <M>Props = Record<string, never> when none);
      export interface <M>ModuleTypes { overlays: 'finding_detail' | ...; routes: '/finance' | '/finance/findings/:id';
      storage: { period: string }; emits: { 'finance.finding_selected': FindingSelectedPayload }; consumes:
      { 'context.settings_changed': SettingsChangedPayload }; shortcuts: 'mod+k' | ...; props: <M>Props }.
      Use never for an empty union and Record<string, never> for an empty map. A consumed event whose producer is not in
      the compile has payload type unknown.
    client_file: |
      <out>/client/<module>.ts, exactly this shape (example for finance):
      import { callOperation, type Result, type CommonErrorCode } from '@dovetail/runtime';
      import type { Margin, MarginInput, Finding, FindingsInput } from '../types/finance';

      export const finance = {
        margin(input: MarginInput): Promise<Result<Margin, 'insufficient_input' | CommonErrorCode>> {
          return callOperation('finance', 'margin', input, { timeout_ms: 10000, idempotent: false, contract_version: 2 });
        },
        findings(input: FindingsInput): Promise<Result<readonly Finding[], 'unavailable' | CommonErrorCode>> {
          return callOperation('finance', 'findings', input, { timeout_ms: 10000, idempotent: false, contract_version: 2 });
        },
      } as const;

      export default finance;
    notes: >
      Operations are emitted in sorted order. An operation with no input declares input: Record<string, never> and the
      function takes no argument: findings(): ... callOperation('finance', 'findings', {}, ...). timeout_ms defaults to
      10000 and idempotent to false when the contract omits them. The exported object name is the module id in
      camelCase (people_operations -> peopleOperations).

  signing:
    owner: slice_b
    consumers: [slice_a]
    api: >
      Dovetail::Signing.sign(shape_hash, private_key_pem) -> base64 signature string (strict_encode64).
      Dovetail::Signing.verify(shape_hash, signature_b64, public_key_pems) -> :ok | :bad_signature.
      Dovetail::Signing.signature_path(shape_path) -> the .json suffix replaced by .sig.
      Both use OpenSSL::PKey::RSA#sign_pss / #verify_pss with "SHA256", salt_length: :digest, mgf1_hash: "SHA256",
      over Dovetail::CanonicalJSON.dump(shape_hash). verify returns :ok if any key verifies.

  config:
    owner: slice_d
    consumers: [slice_b]
    api: >
      Dovetail::Config.find(start_dir) -> Dovetail::Config or nil, found by walking up from start_dir to the first
      dovetail.yml. Dovetail::Config.load(path). Readers: root (absolute app root), contracts (array of absolute contract
      paths from the glob), panels (array of absolute panel dirs), shell (absolute), out (absolute), public_keys (array of
      absolute PEM paths), require_signed (Boolean), rules_profile ("strict" or "relaxed"), tokens (absolute path or nil
      for the built-in vocabulary), layout (absolute), node (a path, "node", or false), themes (array of absolute theme JSON
      paths from the glob, default <shell>/themes/*.json). Defaults are the spec's configuration_file defaults.

  checker_api:
    owner: slice_b
    consumers: [slice_d]
    api: >
      Dovetail::Shape.check(panel_dir:, shape:, profile: "strict", changed: nil) -> Dovetail::Shape::Report, where shape
      is the parsed shape Hash. Report#findings is an Array of Dovetail::Shape::Finding (Struct with file, line, column,
      rule, seam, severity, message, fix; file relative to panel_dir), Report#errors and Report#warnings are Integers,
      Report#to_h gives the spec's JSON form. It raises Dovetail::Error D-CHK-001 when a file cannot be read.

  contract_api:
    owner: slice_a
    consumers: [slice_d]
    api: >
      Dovetail::Contract.load_file(path) -> Dovetail::Contract::Model (raises Dovetail::Error D-CON-001).
      Dovetail::Contract.validate(models) -> Array of Dovetail::Contract::Finding (Struct with rule, severity, module_id,
      message), checking C001 to C006 across the whole set; a consumed event or depends_on whose module is not in the set
      gives a warning, not an error. Dovetail::Contract.diff(old_model_hash, new_model_hash) -> Array of
      Dovetail::Contract::Change (Struct with kind :breaking or :compatible, description) plus
      Dovetail::Contract.version_ok?(old_hash, new_hash, changes) -> Boolean (false when any breaking change keeps the
      version; this is C007). Model#to_h returns the model_json Hash. Dovetail::Compiler.compile(models, out:) writes every
      output for every model and returns an Array of the written paths (relative to out); it raises Dovetail::Error
      D-CON-002 with details[:findings] when validation has errors. Dovetail::Compiler::Brief.render(model) ->
      String and Dovetail::Compiler::Brief.render_shape(shape_hash) -> String (the shape-only brief).

  token_vocabulary:
    owner: slice_b
    consumers: [slice_c, slice_d]
    path: lib/dovetail/tokens/vocabulary.yml
    api: >
      Dovetail::Tokens.vocabulary(path = nil) -> the parsed Hash. Dovetail::Tokens.css_vars -> Array of every family
      custom property name (with --). Dovetail::Tokens.host_vars. Dovetail::Tokens.theme_keys -> css_vars plus host_vars
      without the leading --, which is exactly the key set every theme file's tokens must have.
      Dovetail::Tokens::ClassGrammar.classify(class_name) -> [:ok] | [:refused, rule_id, suggestion_or_nil].
    content: |
      schema: dovetail.tokens/v1
      families:
        color:
          css_var: "--{token}"
          tokens: [surface, surface-2, surface-3, text, text-dim, text-faint, accent, accent-hover, accent-contrast, border, border-strong, success, warning, danger, info]
        space:
          css_var: "--space-{token}"
          tokens: ["0", "0.5", "1", "1.5", "2", "3", "4", "5", "6", "8", "10", "12", "16"]
        radius:
          css_var: "--corner-{token}"
          tokens: [none, sm, md, lg, xl, full]
        type:
          css_var: "--type-{token}"
          line_height_var: "--type-{token}-leading"
          tokens: [xs, sm, base, lg, xl, 2xl, 3xl]
        weight:
          css_var: "--weight-{token}"
          tokens: [regular, medium, semibold, bold]
        shadow:
          css_var: "--elevation-{token}"
          tokens: [none, sm, md, lg]
        motion:
          css_var: "--motion-{token}"
          tokens: [fast, base, slow]
          extra_vars: ["--motion-ease"]
      css_var_rule: A dot in a token is written as an underscore in its custom property, so space 0.5 is --space-0_5.
      host_vars: ["--scrim", "--accent-soft", "--danger-contrast", "--family-sans", "--family-mono", "--family-display", "--max-width"]
      variants:
        pseudo: [hover, focus, focus-visible, active, disabled, dark, motion-reduce]
        breakpoints: [sm, md, lg, xl]
        containers: ["@sm", "@md", "@lg", "@xl"]
        aria: [busy, checked, current, disabled, expanded, hidden, invalid, pressed, readonly, required, selected]
        data_pattern: "data-[a-z][a-z0-9-]*"
      utilities:
        color:
          prefixes: [bg, text, border, border-t, border-r, border-b, border-l, border-x, border-y, border-s, border-e, ring, ring-offset, outline, divide, fill, stroke, placeholder, caret, decoration, accent]
          keywords: [transparent, current, inherit]
          opacity_modifiers: ["5", "10", "15", "20", "25", "30", "40", "50", "60", "70", "75", "80", "90", "95"]
        space:
          prefixes: [p, px, py, pt, pr, pb, pl, ps, pe, m, mx, my, mt, mr, mb, ml, ms, me, gap, gap-x, gap-y, space-x, space-y, inset, inset-x, inset-y, top, right, bottom, left, start, end, w, h, size, min-w, min-h, max-w, max-h, basis, translate-x, translate-y, scroll-m, scroll-p]
          negatable: [m, mx, my, mt, mr, mb, ml, ms, me, inset, inset-x, inset-y, top, right, bottom, left, start, end, translate-x, translate-y, space-x, space-y]
          extra_values: [px]
          keywords:
            m: [auto]
            mx: [auto]
            my: [auto]
            mt: [auto]
            mr: [auto]
            mb: [auto]
            ml: [auto]
            ms: [auto]
            me: [auto]
            inset: [auto, full, "1/2"]
            inset-x: [auto, full, "1/2"]
            inset-y: [auto, full, "1/2"]
            top: [auto, full, "1/2"]
            right: [auto, full, "1/2"]
            bottom: [auto, full, "1/2"]
            left: [auto, full, "1/2"]
            start: [auto, full, "1/2"]
            end: [auto, full, "1/2"]
            w: [auto, full, min, max, fit, "1/2", "1/3", "2/3", "1/4", "3/4", "1/5", "2/5", "3/5", "4/5"]
            h: [auto, full, min, max, fit]
            size: [auto, full, min, max, fit]
            min-w: [full, min, max, fit]
            min-h: [full, min, max, fit]
            max-w: [none, full, prose, min, max, fit]
            max-h: [none, full, min, max, fit]
            basis: [auto, full, "1/2", "1/3", "2/3", "1/4", "3/4"]
            translate-x: [full, "1/2"]
            translate-y: [full, "1/2"]
        radius:
          prefixes: [rounded, rounded-t, rounded-r, rounded-b, rounded-l, rounded-s, rounded-e, rounded-tl, rounded-tr, rounded-br, rounded-bl]
        type:
          size_prefix: text
          weight_prefix: font
        shadow:
          prefix: shadow
        motion:
          prefix: duration
        numbered:
          grid-cols: {from: 1, to: 12, extra: [none, subgrid]}
          grid-rows: {from: 1, to: 6, extra: [none, subgrid]}
          col-span: {from: 1, to: 12, extra: [full]}
          col-start: {from: 1, to: 13, extra: [auto]}
