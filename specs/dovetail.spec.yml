      size: strip
    views:
    - name: inbox
      data_operation: workbench.render_recommendation
      states:
      - loading
      - empty
      - error
      - unavailable
      - ready
    - name: evidence
      data_operation: workbench.display_evidence
      states:
      - loading
      - empty
      - error
      - unavailable
      - ready
    overlays:
    - name: decision_dialog
      kind: modal
      dismissible: true
      blocking: true
    - name: evidence_drawer
      kind: drawer
      dismissible: true
      blocking: true
    capabilities:
    - overlay
    - navigation
    - storage
    - keyboard
    routes:
    - "/workbench"
    - "/workbench/inbox/:id"
    events:
      emits:
      - workbench.decision_recorded
      consumes:
      - assurance.verification_changed
    storage_keys:
    - name: inbox_filter
      ttl_days: 30
    shortcuts:
    - keys: mod+enter
      scope: panel
    - keys: mod+shift+r
      scope: panel
    cutout_panel_files: modules/workbench/panel/src/cutouts/*.svelte, one per cutout (see the Grokit spec)
implementation_decisions:
- date: '2026-09-28'
  topic: routes
  decision: >-
    C005 uses the module namespace /<module id> with _ written as -; the shell owns / and shows the first route of
    layout.yml's home module there. The draft Grokit shapes move People & Operations to /people-operations and
    Workbench to /workbench, with home: workbench in the Grokit layout.
- date: '2026-09-28'
  topic: check command line
  decision: >-
    dovetail check also accepts the form Reach calls today, dovetail check --require-signed <shape.json>
    [--changed <file>]: a positional argument ending in .json is the shape, the panel directory defaults to the
    current directory, and --changed limits reported findings to one file. Public keys come from --public-key (repeatable),
    then DOVETAIL_PUBLIC_KEYS (paths joined by the platform path separator), then public_keys in the nearest dovetail.yml.
    The signature file is the shape path with .json replaced by .sig. D-SHP-002 means no configured key verifies the
    signature; D-SHP-003 means a signature is required and no public key is configured.
- date: '2026-09-28'
  topic: rule profiles
  decision: >-
    Under the strict profile S-LAY-003, S-HTML-002 and S-CSS-005 are errors; under relaxed they are warnings. Every
    other rule has the catalogue's severity under both profiles.
- date: '2026-09-28'
  topic: non-literal names
  decision: >-
    When openOverlay, navigate, link, emit, on or t is called with a name that is not a string literal, the checker
    reports the same rule id (S-OVL-003, S-NAV-002, S-EVT-002, S-I18N-001) as a warning saying the name cannot be
    checked, because unknown is never treated as safe.
- date: '2026-09-28'
  topic: heading levels
  decision: >-
    S-HTML-002 flags h1 in any panel, and h2 in a panel that declares no main or full slot, because the checker sees
    the panel's slots but not which slot a given component renders in.
- date: '2026-09-28'
  topic: contract loading
  decision: >-
    A contract file is parsed with Ripper and accepted only if every node is on an allowlist (DSL calls, the Dovetail
    constant, the scalar type constants, literals, arrays, hashes and blocks, and require 'dovetail'); only then is it
    evaluated in a BasicObject context. Anything else is D-CON-001.
- date: '2026-09-28'
  topic: descriptions
  decision: >-
    Dovetail.contract, operation, emits, view, overlay and slot accept an optional description: string, which the
    brief uses for "What your panel is for" and the other sections.
- date: '2026-09-28'
  topic: overlay defaults
  decision: >-
    blocking defaults to true for modal and drawer and to false for popover, menu and toast; dismissible defaults to
    true.
- date: '2026-09-28'
  topic: model files and C007
  decision: >-
    compile also writes <out>/model/<module>.model.json (the contract show model). fuse checks C007 by diffing each
    contract against the model file its previous fuse left in the output directory.
- date: '2026-09-28'
  topic: panel binding
  decision: >-
    A panel's primitives know their module because the fuser resolves @dovetail/runtime, for every file under a panel
    directory, to a generated module .dovetail/bind/<module>.ts that re-exports the runtime bound to that module
    (createPanelApi from @dovetail/runtime/internal). Files outside panel directories get the unbound runtime.
    $generated resolves to <out>/generated. Each panel's entry is src/Panel.svelte; it receives a slot prop naming
    the slot it is rendering and the contract's declared props.
- date: '2026-09-28'
  topic: css custom properties
  decision: >-
    Token CSS custom properties are --<colour> for colours, --space-<n> for space (a . in the step is written _, so
    --space-0_5), --corner-<size> for radius, --type-<size> and --type-<size>-leading for type, --weight-<name> for
    weight, --elevation-<size> for shadow, --motion-<speed> and --motion-ease for motion. Host tokens used only by
    the shell and runtime are --scrim, --accent-soft, --danger-contrast, --family-sans, --family-mono,
    --family-display and --max-width. None of these names collides with a Tailwind v4 theme namespace, so the
    generated Tailwind theme can map class names onto them. The exact class vocabulary is
    lib/dovetail/tokens/vocabulary.yml.
- date: '2026-09-28'
  topic: container variants
  decision: >-
    The class grammar also accepts the container-query variants @sm, @md, @lg and @xl (320, 480, 640 and 800 px of
    slot width), which are the container-query helpers the layout seam names; every slot is an inline-size container.
- date: '2026-09-28'
  topic: themes
  decision: >-
    The shell template ships Grokit's three themes, apple-noir, apple-austere and tronwave, copied from
    ~/rstack/themes and mapped onto Dovetail's tokens (never wired). A theme file is ui/themes/<id>.json holding id,
    name, color_scheme and every token. The template has no theme switcher and uses the first theme listed, as
    Grokit chooses themes in its own Settings (Grokit rounds 12 and 13).
- date: '2026-09-28'
  topic: placement
  decision: >-
    A panel slot mounts into the layout slot of the same name, or else the first layout slot of the same size. Main
    and full layout slots show the panel that owns the current route; aside shows that panel's aside slot; tile slots
    render while the home route is active; strip slots in the dock region always render.
- date: '2026-09-28'
  topic: shell and runtime additions
  decision: >-
    The runtime also exports useNavigation() for shell code (the layout's navigation with each entry's href and
    active state), @dovetail/runtime/components (the components plus View, States and Overlay), and
    @dovetail/runtime/icons (the Phosphor icon set, so IconButton has icons without a package outside the allowed
    list). States accepts each state as a component or a snippet of the same name.
- date: '2026-09-28'
  topic: development hooks
  decision: >-
    Development builds expose window.__dovetail, the hook the composition verifier and the development toolbar drive:
    panels, overlays, routes, events, forced view states, mount and unmount, leak counters, crashes, slot rectangles
    and transport statistics. Production builds do not include it.
- date: '2026-09-28'
  topic: data client safety
  decision: >-
    Besides the spec's timeouts and retries, the HTTP transport caps each module at 6 requests in flight, limits each
    module to 10 requests a second with bursts of 20, opens a circuit for 30 seconds after 5 consecutive unavailable
    results, and can disable a module or the whole transport by configuration.
- date: '2026-09-28'
  topic: fuse builds
  decision: >-
    --out names the output directory (default: out in dovetail.yml, .dovetail). fuse writes the compiled contracts
    to <out>/generated, the production bundle to <out>/dist (and nothing else there, so dist is what gets deployed),
    the report to <out>/fuse-report.json, and with --verify a development bundle to <out>/verify-build, which
    dovetail verify serves on 127.0.0.1 and drives with Ferrum and the system Chrome, writing failure screenshots to
    <out>/screenshots. The
    Node side of fuse and dev is runtime/tools/*.mjs, run with the runtime's own node_modules; an application with no
    node_modules of its own gets a node_modules symlink to the runtime's, and the shell template ignores it. Each build and dev server keeps its Vite
    cache in <out>/vite-cache, so applications never share one. fuse
    loads every contract the configuration's contracts glob names, panel or not, so a module that only emits events
    takes part in validation. The type check resolves @dovetail/runtime to the runtime's own types, not to a panel's
    bound module, because TypeScript path mappings are global to a compilation, and it runs with strict on so Result
    narrows on ok.
- date: '2026-09-28'
  topic: local classes
  decision: >-
    A class name that the same component's own style block defines as a class selector is a local, Svelte-scoped
    class and is not checked against the token vocabulary; S-CSS-001 applies only to classes the component does not
    define itself. The style block's values are still held to S-CSS-003.
- date: '2026-09-28'
  topic: required states
  decision: >-
    <States> renders a default component (Skeleton, EmptyState, ErrorState, UnavailableState) for any state the
    author leaves out, so a View that contains a States element satisfies S-STATE-001 for every required state. The
    rule fires when a declared view has no View element, or when a View without States does not branch on every
    required state.
- date: '2026-09-28'
  topic: brief wording
  decision: >-
    The brief's examples use the panel's own names (its overlays, routes, storage keys and shortcuts), and each
    undeclared seam gets a fixed plain sentence, so no module's brief shows another module's example.
- date: '2026-09-28'
  topic: command line errors
  decision: >-
    dovetail <command> --help (or -h) prints that command's usage line and exits 0. An unknown option, a missing
    argument, or an input file named on the command line that cannot be read prints D-USE-001 with the reason and exits
    2; no command prints a Ruby backtrace for these. A missing or invalid dovetail.yml is D-CFG-001, and a verifier that
    cannot run is D-VER-002.
- date: '2026-09-28'
  topic: states props
  decision: >-
    States takes loading, empty, error, unavailable and ready each as a component or as a snippet of the same name,
    so the worked example's error={ErrorState} and a {#snippet ready()} child both work. A snippet is told from a
    component because Svelte compiles snippets to arrow functions, which have no prototype. The error value is the
    failure prop and the retry action the retry prop. Components receive props (ready gets data; error gets body and
    retry; unavailable gets retry and retry_after_s); snippets receive arguments (ready(data), error(failure, retry),
    unavailable(failure, retry)).
- date: '2026-09-28'
  topic: document reach and aliases
  decision: >-
    S-LAY-004 is added, because the type layer already says panel markup renders only inside its slot and portals go
    only through the overlay host, yet no rule checked a panel reaching the page through document. Aliases of globals
    cover window, globalThis, self and document, including destructuring from them (const { fetch: f } = window) and
    member reads that are not calls (window.localStorage). A dynamic import() of a package outside the allowed list
    is S-DEP-001, and a dynamic import() whose argument is not a string literal is S-DEP-001 as a warning.
    Bare global functions are judged as window's (addEventListener, removeEventListener, dispatchEvent,
    postMessage), and any reference to eval or Function, called or not, is S-DYN-001. navigator.sendBeacon joins
    S-DAT-001 and requestIdleCallback joins S-LIF-001, since each is the same effect by another name. The name
    checks on openOverlay, navigate, link, emit, on, t, store and shortcut apply only to names bound by an import
    from @dovetail/runtime, so a local function that happens to share a name is not judged as the primitive.
- date: '2026-09-28'
  topic: live components, import map sharing
  decision: >-
    A live build's index.html carries a single import map naming the shared Svelte runtime entries the compiler's
    output can reach for and every @dovetail/runtime entry (bare, and its components, icons and internal subpaths),
    each built once from source into <out>/dist/vendor and used by both the bundled application and every live
    component, so there is one instance of the runtime's state and one instance of Svelte across the page. A panel's
    own bound primitives (openOverlay, emit, navigate and the rest) get one further, per-module import-map entry so a
    live component's plain @dovetail/runtime import still resolves to its own module's bound API; the loader rewrites
    that bare specifier before evaluating the compiled component, and rewrites a relative import of another live file
    to that file's own entry the same way, so nesting live components works without the browser needing to know the
    application's file layout.
- date: '2026-09-30'
  topic: live components, import rewriting
  decision: >-
    The loader rewrites only import and export statements that begin a line of the compiled component, and dynamic
    import() calls, so text such as a message key ending in from followed by a quote is never read as an import.
- date: '2026-09-28'
  topic: live components, styling safelist
  decision: >-
    fuse builds the Tailwind entry CSS from the full token-class vocabulary, not from a scan of the files Vite
    bundles, whenever live is non-empty, so a class a live component reaches for is already in the stylesheet the
    page loaded before that component ever fetches. A build with no live globs keeps scanning only the panel and
    shell directories, as before.
- date: '2026-09-28'
  topic: live components, failure rendering
  decision: >-
    A live component is loaded by a small host component mounted where the bundled import would have been, so it
    sits inside the same svelte:boundary PanelHost already wraps every panel in. A fetch, compile or import failure
    is caught there, logged once to console.error with the file's path, and re-raised inside an effect so the
    panel's existing fallback card renders it; the failure never reaches outside that one panel's boundary.
- date: '2026-09-28'
  topic: overlay focus and the verifier
  decision: >-
    The overlay host moves focus into every overlay when it opens (its first focusable element, or the overlay
    itself), and only a blocking overlay adds a focus trap. The composition verifier checks the trap for a blocking
    overlay and the active element for any other, so a non-blocking popover is judged by where focus is, not by a
    trap it never had. Each overlay element carries data-dovetail-overlay with its id for that check.
- date: '2026-09-28'
  topic: tile views and the verifier
  decision: >-
    A tile slot is placed only on the home module's route, so the state journey looks for a view there when the
    panel's own route did not render it. The development hooks expose homeModule() from the same rule the slot
    placement uses.
- date: '2026-09-28'
  topic: decorative icons and blur races
  decision: >-
    Every runtime icon that sits beside a text label is aria-hidden, so axe's svg-img-alt stays clean. A Tooltip's
    hide and a NumberInput's blur normalisation run in a microtask, because a focused element removed during a render
    fires blur inside Svelte's flush, where changing state throws state_unsafe_mutation.
- date: '2026-09-28'
  topic: embed build and the fuse report
  decision: >-
    The embed build runs inside the build step, after the application bundle, and the report's build section gains
    embed: {ok: true, path, tag} when it ran, {skipped: reason} when embed is on but live globs are set or node is
    false, and no embed key when embed is off. A failed embed build is D-FUS-004, like the application build.
    prefetch.json is written by the generate step and listed in its generated files.
- date: '2026-09-28'
  topic: embed styles
  decision: >-
    The embed bundle compiles Svelte components with injected CSS, which Svelte appends to the root node the
    component mounts in, so inside the element every component's styles land in the shadow root. The fused app.css
    is imported as a string and placed in a style element at the top of the shadow root, before the application
    mounts. The shadow root's host rule sets display block.
- date: '2026-09-28'
  topic: one runtime, one root
  decision: >-
    The runtime state gains root (the Document or the ShadowRoot the shell lives in) and the element that hosts an
    embedded application. Every lookup that used document.querySelector, document.activeElement or a
    document-level listener now goes through the root, and the theme style element goes into document.head for a
    Document root and into the ShadowRoot otherwise. A standalone application's root is the document, so its
    behaviour is unchanged.
- date: '2026-09-28'
  topic: routing through an adapter
  decision: >-
    The navigation seam reads and writes the current path through a location adapter in runtime state. The history
    adapter uses location and history as 0.2.0 did and listens for popstate; the memory adapter keeps the path and
    query in state and never touches the host's URL. The shell's link interception and the development hooks'
    navigate go through the adapter.
- date: '2026-09-28'
  topic: Escape and the native dialog
  decision: >-
    0.2.0 closed an overlay on Escape both in the overlay's own keydown handler and in the shell's document keydown
    handler, so one Escape could close two stacked dismissible overlays. With native dialogs the per-overlay handler
    is removed and the dialog's cancel event is prevented, leaving one Escape to close one overlay, the topmost
    dismissible one. Chrome's close watcher can still fire cancel at the dialog left on top after the first one is
    removed, and ignores a prevented cancel when there was no user activation, so the shell's keydown listener also
    calls preventDefault on the Escape keydown whenever it dismissed an overlay, which stops the browser's own
    dialog handling for that key press. A blocking overlay now sits above the development toolbar, which is inert
    while it is open.
- date: '2026-09-28'
  topic: prefetch hold
  decision: >-
    Held prefetch results live in runtime state keyed <module>.<operation>, each with the time it was started. A
    route change starts a prefetch only for an operation that has no fresh held result, so returning to a route
    within 5 seconds does not call twice. The development transport takes part in prefetch like any other, so the
    composition journeys exercise it. The shell starts prefetch from an $effect.pre, which runs before the panels'
    own effects; a plain $effect would run after a panel's first call and never be taken.
